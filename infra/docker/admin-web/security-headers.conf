# Cabeceras de seguridad básicas. Se incluye a nivel server y en cada location
# que use add_header (un add_header en una location anula los heredados).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# style-src 'unsafe-inline': Mantine inyecta estilos en runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# HSTS: activar solo cuando se sirva detrás de HTTPS (TLS en el VPS).
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
