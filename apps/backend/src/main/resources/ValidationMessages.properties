# Mensajes de Bean Validation (español, UTF-8). Se muestran al usuario final en ProblemDetail.errors[].message.
# Las claves jakarta.* sobrescriben los mensajes por defecto para que la API responda siempre en español.

jakarta.validation.constraints.AssertFalse.message=debe ser falso
jakarta.validation.constraints.AssertTrue.message=debe ser verdadero
jakarta.validation.constraints.DecimalMax.message=debe ser menor o igual a {value}
jakarta.validation.constraints.DecimalMin.message=debe ser mayor o igual a {value}
jakarta.validation.constraints.Digits.message=admite hasta {integer} dígitos enteros y {fraction} decimales
jakarta.validation.constraints.Email.message=debe ser un email válido
jakarta.validation.constraints.Future.message=debe ser una fecha futura
jakarta.validation.constraints.FutureOrPresent.message=debe ser una fecha presente o futura
jakarta.validation.constraints.Max.message=debe ser menor o igual a {value}
jakarta.validation.constraints.Min.message=debe ser mayor o igual a {value}
jakarta.validation.constraints.Negative.message=debe ser negativo
jakarta.validation.constraints.NegativeOrZero.message=debe ser cero o negativo
jakarta.validation.constraints.NotBlank.message=es obligatorio
jakarta.validation.constraints.NotEmpty.message=no puede estar vacío
jakarta.validation.constraints.NotNull.message=es obligatorio
jakarta.validation.constraints.Null.message=debe estar vacío
jakarta.validation.constraints.Past.message=debe ser una fecha pasada
jakarta.validation.constraints.PastOrPresent.message=debe ser una fecha pasada o presente
jakarta.validation.constraints.Pattern.message=tiene un formato inválido
jakarta.validation.constraints.Positive.message=debe ser mayor a cero
jakarta.validation.constraints.PositiveOrZero.message=debe ser cero o mayor
jakarta.validation.constraints.Size.message=el tamaño debe estar entre {min} y {max}

# Configuración (app.*)
app.security.jwt.secret.required=JWT_SECRET es obligatorio (Base64, mínimo 32 bytes). Generalo con: openssl rand -base64 48

# Política de contraseña nueva (@ValidPassword)
auth.password.size=debe tener entre {min} y {max} caracteres
auth.password.pattern=debe incluir al menos una letra y un número
validation.max-utf8-bytes=es demasiado larga: las letras con tilde y la ñ ocupan el doble, acortala un poco
