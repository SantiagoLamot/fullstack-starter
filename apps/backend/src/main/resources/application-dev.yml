# Local development profile (docker compose). Swagger UI and API docs enabled.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  devtools:
    restart:
      enabled: true
      poll-interval: ${DEV_FILE_POLLING_INTERVAL_MS:1000}ms
      quiet-period: 400ms

logging:
  level:
    com.example.app: DEBUG
